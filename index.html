<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHIP hands-on lab equipment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4E8EB; --panel:#F6F8F9; --ink:#1E2A33; --muted:#5A6873; --line:#C5CDD3;
  --mark:#F5B700; --mark-ink:#1E2A33; --steel:#3B5B74;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#151B20; --panel:#1E262D; --ink:#E6ECF0; --muted:#9AA8B3; --line:#33404A; --steel:#8FB3CF; }
}
:root[data-theme="dark"]{ --bg:#151B20; --panel:#1E262D; --ink:#E6ECF0; --muted:#9AA8B3; --line:#33404A; --steel:#8FB3CF; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding:clamp(16px,3vw,36px)}
header h1{font-stretch:125%;font-weight:800;font-size:clamp(1.6rem,3.6vw,2.6rem);line-height:1.05;margin:0 0 .35rem;letter-spacing:-.01em}
header p{margin:0 0 1.5rem;color:var(--muted);max-width:60ch}
.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:clamp(16px,2.5vw,28px);align-items:start}
.layout>.panel{grid-column:2;grid-row:1 / span 2}.layout>.overview{grid-column:1;grid-row:2}
@media (max-width:860px){.layout>.panel,.layout>.overview{grid-column:auto;grid-row:auto}}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.stage{position:relative;border-radius:10px;overflow:hidden;background:#cfd4d7;line-height:0}
.stage img{width:100%;max-width:100%;height:auto;display:block}
.hot{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;
  border:3px solid var(--mark-ink);background:var(--mark);color:var(--mark-ink);
  font:800 15px/1 "Archivo",sans-serif;cursor:pointer;display:grid;place-items:center;
  box-shadow:0 0 0 3px rgba(255,255,255,.85);transition:transform .15s}
.hot:hover{transform:translate(-50%,-50%) scale(1.12)}
.hot:focus-visible{outline:3px solid var(--steel);outline-offset:4px}
.hot[aria-pressed="true"]{background:var(--mark-ink);color:var(--mark);border-color:var(--mark)}
.hot[aria-pressed="true"]::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:2px solid var(--mark);animation:ring 1.4s ease-out infinite}
@keyframes ring{from{opacity:1;transform:scale(.7)}to{opacity:0;transform:scale(1.4)}}
@media (prefers-reduced-motion:reduce){.hot[aria-pressed="true"]::after{animation:none}.hot{transition:none}}
.tip{position:absolute;left:50%;top:calc(100% + 6px);transform:translateX(-50%);white-space:nowrap;
  background:var(--mark-ink);color:#fff;font-weight:600;font-size:12px;line-height:1;padding:5px 7px;border-radius:4px;
  opacity:0;pointer-events:none;transition:opacity .15s}
.hot:hover .tip,.hot:focus-visible .tip{opacity:1}
.hot:hover,.hot:focus-visible{z-index:3}
.tip-l .tip{left:-4px;transform:none}.tip-r .tip{left:auto;right:-4px;transform:none}
.hint{margin:.75rem 0 0;font-size:.9rem;color:var(--muted)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:clamp(18px,2.4vw,26px);position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
@media (max-width:860px){.panel{position:static}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 1.25rem;padding:0;list-style:none}
.chips button{font:600 .85rem/1 "Archivo",sans-serif;padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;display:flex;gap:6px;align-items:center}
.chips button span{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--mark);color:var(--mark-ink);font-size:11px;font-weight:800}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chips button:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
.panel h2{font-stretch:112%;font-weight:800;font-size:1.5rem;line-height:1.15;margin:0 0 .25rem}
.role{margin:0 0 1rem;color:var(--muted)}
.specs{width:100%;border-collapse:collapse;font-size:.95rem}
.specs th,.specs td{text-align:left;vertical-align:top;padding:.55rem 0;border-top:1px solid var(--line)}
.specs th{font-weight:500;color:var(--muted);width:42%;padding-right:12px}
.specs td{font-weight:600;font-variant-numeric:tabular-nums}
.note{margin:1rem 0 0;font-size:.85rem;color:var(--muted);border-left:3px solid var(--mark);padding-left:10px}
.empty h2{font-stretch:100%}
#detail{animation:in .2s ease-out}
@keyframes in{from{opacity:.3}to{opacity:1}}
.overview{margin-top:clamp(8px,2vw,16px);max-width:78ch}
.overview h2{font-stretch:112%;font-weight:800;font-size:1.6rem;line-height:1.15;margin:0 0 .5rem}
.overview h3{font-stretch:112%;font-weight:700;font-size:1.15rem;margin:1.75rem 0 .75rem}
.overview p{margin:0 0 .75rem}
.overview .aside{color:var(--muted);font-size:.95rem}
.flow{list-style:none;margin:0 0 .75rem;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;counter-reset:f}
.flow li{counter-increment:f;position:relative;padding:12px 18px 12px 0;border-top:3px solid var(--steel)}
.flow li::before{content:counter(f);position:absolute;top:-14px;left:0;width:24px;height:24px;border-radius:50%;background:var(--steel);color:var(--panel);font-weight:800;font-size:13px;display:grid;place-items:center}
.flow b{display:block;margin-top:10px}
.flow span{display:block;font-size:.9rem;color:var(--muted);line-height:1.4}
@media (max-width:600px){.flow{grid-template-columns:1fr 1fr;row-gap:22px}}
.ideas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
@media (max-width:520px){.ideas{grid-template-columns:1fr}}
.ideas div{background:var(--panel);padding:14px 16px}
.ideas b{display:block;margin-bottom:4px}
.ideas p{margin:0;font-size:.9rem;color:var(--muted);line-height:1.45}

.tabs{display:flex;gap:4px;margin:0 0 1.25rem;border-bottom:2px solid var(--line);flex-wrap:wrap}
.tabs button{font:700 1rem/1.2 "Archivo",sans-serif;font-stretch:105%;padding:10px 14px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--mark)}
.tabs button:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
.kicker{margin:0 0 .25rem;color:var(--muted);font-weight:600}

.stage{container-type:inline-size}
.lbl{position:absolute;z-index:2;display:block;text-align:left;cursor:pointer;border:0;padding:.45em .8em .45em 1em;border-radius:.45em;background:#FAFAF8;color:#1E2A33;
  font-family:"Archivo",system-ui,sans-serif;font-size:clamp(8px,1.45cqw,16px);line-height:1.2;box-shadow:inset .35em 0 0 var(--mark),0 2px 6px rgba(0,0,0,.35);white-space:nowrap}
.lbl b{display:block;font-weight:700;font-size:1em}
.lbl small{display:block;font-size:.8em;color:#506070}
.lbl:hover{background:#fff}
.lbl[aria-pressed="true"]{background:#1E2A33;color:#fff;box-shadow:inset .35em 0 0 var(--mark),0 0 0 2px var(--mark)}
.lbl[aria-pressed="true"] small{color:#C9D3DA}
.lbl:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
@container (max-width:520px){.lbl small{display:none}}
.layout{grid-template-rows:auto 1fr}
.dot{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--mark);border:2px solid #1E2A33;pointer-events:none;z-index:1}
.leaders{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.leaders line{stroke:#fff;stroke-width:1.5}
.course{margin-top:1.1rem;border-top:1px solid var(--line);padding-top:.9rem}
.course h3{margin:0 0 .5rem;font-size:1.05rem;font-weight:800;display:flex;align-items:center;gap:8px}
.course h3 i{font-style:normal;font-size:.75rem;font-weight:700;background:var(--mark);color:#1E2A33;padding:2px 7px;border-radius:4px}
.course ul{margin:0;padding:0;list-style:none}
.course li{padding:.4rem 0}
.course li span{display:block;font-size:.8rem;color:var(--muted);font-weight:600}
.course li b{font-weight:700}
.course .ds{margin:.2rem 0 0;font-size:.88rem;color:var(--muted);line-height:1.45}
.official{margin:.1rem 0 .6rem;font-weight:600;color:var(--steel)}
.speclink{margin-top:1rem;font:700 .9rem "Archivo",sans-serif;padding:8px 12px;border-radius:6px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.speclink:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
.cov{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:.5rem}
.cov th,.cov td{text-align:left;padding:.5rem .6rem .5rem 0;border-top:1px solid var(--line);vertical-align:top}
.cov thead th{border-top:0;color:var(--muted);font-weight:600}
.covwrap{overflow-x:auto}
</style>
</head>

   overview:`
        <h2>What this is</h2>
        <p>This is the <strong>Smart Conveyor Belt with Vibration Analysis</strong>, part of <strong>Lab B</strong> (motor and conveyor) in the SHIP first-semester hands-on labs. It is a small model of the conveyors used in factories, warehouses and ports. An Arduino drives a stepper motor, so the belt can run at an exact speed, stop at an exact spot, and move forward or backward, while a vibration sensor checks the health of the machine.</p>

        <h3>How it works</h3>
        <ol class="flow">
          <li><b>Arduino Mega</b><span>runs the program (Arduino or Simulink) and sends step and direction pulses</span></li>
          <li><b>Microstep driver</b><span>turns those small pulses into strong current for the motor</span></li>
          <li><b>Stepper motor + gearbox</b><span>turns the roller in exact steps with more torque</span></li>
          <li><b>Conveyor belt</b><span>moves the items along the frame</span></li>
        </ol>
        <p class="aside">The WitMotion vibration sensor connects to the computer by USB, so vibration can be recorded and its FFT spectrum plotted while the belt runs.</p>

        <h3>Labs in Engineering Basics</h3>
        <div class="ideas">
          <div><b>Week 12: Energy Sankey diagram</b><p>Measure the electrical energy in and the useful work out, then draw where the losses go.</p></div>
          <div><b>Week 14: Vibration monitoring</b><p>Record vibration at different speeds. A rise warns of loose parts, misalignment or wear before failure.</p></div>
          <div><b>Discrete vs continuous</b><p>The stepper moves items one station at a time; the DC motor runs continuously. Compare throughput and energy per item.</p></div>
          <div><b>Week 16: Digital twin</b><p>Run the Simulink model side by side with the real belt and compare predicted and measured behaviour.</p></div>
        </div>

        <h3>Calculus on the belt</h3>
        <div class="ideas">
          <div><b>Derivative</b><p>Belt speed is the rate of change of position: steps counted per second, v = dx/dt.</p></div>
          <div><b>Second derivative</b><p>The speed ramp at start and stop limits acceleration, a = dv/dt, so items don't slip.</p></div>
          <div><b>Integral</b><p>Distance moved is the area under the speed–time graph, x = ∫v dt. Check it against the step count.</p></div>
          <div><b>Fourier series (FFT)</b><p>Machine Vibration – Fourier Intuition: the FFT splits the vibration into its frequencies, and the peaks move as the motor speeds up.</p></div>
        </div>

        <h3>More you can build on it</h3>
        <div class="ideas">
          <div><b>Count objects</b><p>Add an IR sensor and count every item that passes.</p></div>
          <div><b>Sort by colour</b><p>Add a colour sensor and a servo arm that pushes items into bins.</p></div>
          <div><b>Stop at a station</b><p>Move each item an exact distance, pause for a task, then continue.</p></div>
          <div><b>Live dashboard</b><p>Show speed, count and vibration on a screen in real time.</p></div>
        </div>
      ` },

   overview:`
        <h2>What this is</h2>
        <p>This is a <strong>DC motor conveyor belt</strong> with an <strong>infrared object sensor</strong> and a <strong>vibration sensor</strong>, part of <strong>Lab B</strong> in the SHIP first-semester hands-on labs. Unlike the stepper conveyor, it runs <strong>continuously</strong>, like the conveyors in process industries. The Arduino sets the belt speed with PWM, and the sensor detects every item that passes.</p>
        <h3>How it works</h3>
        <ol class="flow">
          <li><b>Arduino Mega</b><span>runs the program (Arduino or Simulink) and sends a PWM speed signal</span></li>
          <li><b>Motor driver</b><span>turns the PWM signal into motor power from the supply</span></li>
          <li><b>DC geared motor</b><span>turns the roller smoothly and continuously</span></li>
          <li><b>IR sensor</b><span>sees each item on the belt and tells the Arduino</span></li>
        </ol>
        <p class="aside">The power supply converts mains AC into the DC voltage the motor and driver need. The vibration sensor sits on the frame with its magnet and sends data to the PC by USB.</p>
        <h3>Labs in Engineering Basics</h3>
        <div class="ideas">
          <div><b>Week 7: Actuators and automation</b><p>Start and stop the belt automatically when the sensor sees an item, like a real production line.</p></div>
          <div><b>Week 12: Material flow</b><p>Count items per minute at the sensor to measure throughput of the line.</p></div>
          <div><b>Discrete vs continuous</b><p>Compare this continuous belt with the stepper conveyor that moves one station at a time.</p></div>
          <div><b>Week 13: Mass balance</b><p>Items put on the belt = items counted at the end + items still on the belt.</p></div>
        </div>
        <h3>Calculus on the belt</h3>
        <div class="ideas">
          <div><b>Derivative</b><p>Flow rate is the rate of change of the item count, dN/dt items per second.</p></div>
          <div><b>Integral</b><p>Total items = area under the flow-rate graph, N = ∫(dN/dt) dt.</p></div>
          <div><b>Speed from timing</b><p>Time how long an item takes between two marks: v = Δx/Δt, and smaller gaps approach the instant speed.</p></div>
          <div><b>Fourier series (FFT)</b><p>Machine Vibration – Fourier Intuition: the vibration sensor shows the main peak moving right as the motor speeds up.</p></div>
        </div>
        <h3>More you can build on it</h3>
        <div class="ideas">
          <div><b>Auto stop at sensor</b><p>Stop the belt when an item reaches the end, then restart when it is removed.</p></div>
          <div><b>Add an encoder</b><p>Measure the roller speed and hold it constant under load with PID.</p></div>
          <div><b>Sort by height</b><p>Mount two sensors at different heights to tell tall and short items apart.</p></div>
          <div><b>Live dashboard</b><p>Show speed, count and flow rate on a screen in real time.</p></div>
        </div>` }

     role:"GM25-370 DC motor with encoder, MD13S driver and Arduino Mega, controlled from Simulink.",

              {c:EB, items:[["Lab 1: Energy Conversion and Heat Transfer (Weeks 1–2)","DC motor energy balance: electrical input vs useful motion, losses and efficiency."],["Lab 4: Smart Manufacturing System (Weeks 14, 16)","Closed-loop control with PID, and the Simulink model as a simple digital twin."]]}] },
   { id:"a_m1", name:"Model 1 Draining Vessels", sub:"Ø15 cm × 50 cm", lx:35, ly:5.06, x:62.5, y:17.72,
     official:"Draining Vessel (Model 1)",
     role:"Large acrylic vessels with a side outlet and a scale, for longer drain tests and tank-level experiments.",
     courses:[{c:CAL, items:[["Integration","Draining Vessel: Total Water Out is an Integral"],["Partial derivatives","Water Jets & Drain Time: Which Change Matters More? (Models 1, 2 & 3)"],["ODEs","Draining Vessel: First-Order ODE, Torricelli's Law (Models 1 & 2)"]]},
              {c:EB, items:[["Lab 2: Fluid Mechanics and Pumps (Weeks 5–6)","Draining vessels: continuity and the discharge coefficient."],["Lab 4: Smart Manufacturing System (Week 13)","Tank mass balance: the pump fills the vessel with the outlet open until inflow equals outflow (steady state)."]]}] },
   { id:"a_m2", name:"Model 2 Draining Vessels", sub:"Ø8 cm × 25 cm", lx:35, ly:18.35, x:44.5, y:34.18,
     official:"Draining Vessel (Model 2)",
     role:"Small acrylic vessels with a side outlet and a scale, used to watch the water level fall over time.",
     courses:[{c:CAL, items:[["Introduction to Calculus","Draining Vessel: Water Height as a Function of Time"],["Partial derivatives","Water Jets & Drain Time: Which Change Matters More? (Models 1, 2 & 3)"],["ODEs","Draining Vessel: First-Order ODE, Torricelli's Law (Models 1 & 2)"],["Euler method","Draining Vessel: Euler Method vs Simulink"]]},
              {c:EB, items:[["Lab 1: Energy Conversion and Heat Transfer (Week 4)","Cooling of hot water: bare vs insulated vessel."],["Lab 2: Fluid Mechanics and Pumps (Weeks 5–6)","Draining vessels: continuity, and measured vs predicted drain time to find the discharge coefficient."]]}] },
   { id:"a_m3", name:"Model 3 Six-Hole Vessel", sub:"Water jets", lx:63.44, ly:90.13, x:81.56, y:65.82,
     official:"Water Jets (Model 3)",
     role:"Tall vessel with six holes at different heights, so you can compare the water jets.",
     courses:[{c:CAL, items:[["Maxima & minima","Water Jets: Which Hole Shoots Farthest?"],["Partial derivatives","Water Jets & Drain Time: Which Change Matters More? (Models 1, 2 & 3)"]]},
              {c:EB, items:[["Lab 2: Fluid Mechanics and Pumps (Week 5)","Six-jet vessel: pressure increases with depth, and jet speed from Bernoulli, v = √(2gh)."]]}] }
  ],
  overview:`
    <h2>What this is</h2>
    <p>All the hands-on equipment for the SHIP first-semester labs on one table: two conveyor belts and a DC motor setup (<strong>Lab B</strong>), and six acrylic water vessels in three models (<strong>Lab E</strong>). Tap any label to see its lab titles and where it fits in each course.</p>
    <h3>Where each item is used</h3>
    <div class="covwrap"><table class="cov"><thead><tr><th>Equipment</th><th>Calculus</th><th>Engineering Basics</th></tr></thead><tbody>
      <tr><td><b>DC Motor Conveyor Belt</b></td><td>Derivatives, ODEs, Fourier series (FFT)</td><td>Lab 4</td></tr>
      <tr><td><b>Stepper Conveyor Belt</b></td><td>Derivatives, ODEs, Fourier series (FFT)</td><td>Lab 4</td></tr>
      <tr><td><b>Smart DC Motor</b></td><td>Derivatives, ODEs, Laplace</td><td>Labs 1 and 4</td></tr>
      <tr><td><b>Model 1 Draining Vessels</b></td><td>Integration, Partial derivatives, ODEs</td><td>Labs 2 and 4</td></tr>
      <tr><td><b>Model 2 Draining Vessels</b></td><td>Intro, Partial derivatives, ODEs, Euler</td><td>Labs 1 and 2</td></tr>
      <tr><td><b>Model 3 Six-Hole Vessel</b></td><td>Maxima & minima, Partial derivatives</td><td>Lab 2</td></tr>
    </tbody></table></div>` };
setups.unshift(allEq);
const tabs=document.getElementById('tabs'), stage=document.getElementById('stage'), photo=document.getElementById('photo'),
  chips=document.getElementById('chips'), detail=document.getElementById('detail'), overview=document.getElementById('overview');
let cur, hotBtns={}, chipBtns={};
setups.forEach(s=>{const b=document.createElement('button');b.role='tab';b.id='tab-'+s.id;b.textContent=s.tab;b.setAttribute('aria-selected','false');b.onclick=()=>load(s.id);tabs.appendChild(b);});
function load(id){
  cur=setups.find(s=>s.id===id);
  tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.id==='tab-'+id));
  document.getElementById('title').textContent=cur.title; document.getElementById('sub').textContent=cur.sub;
  photo.src=cur.img; photo.alt=cur.alt;
  stage.querySelectorAll('.hot,.lbl,.dot,.leaders').forEach(b=>b.remove()); chips.innerHTML=''; hotBtns={}; chipBtns={};
  if(cur.labels){ const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.setAttribute('class','leaders'); stage.appendChild(svg); }
  cur.parts.forEach((p,i)=>{
    let b;
    if(cur.labels){
      const d=document.createElement('span'); d.className='dot'; d.style.left=p.x+'%'; d.style.top=p.y+'%'; stage.appendChild(d);
      b=document.createElement('button'); b.className='lbl'; b.style.left=p.lx+'%'; b.style.top=p.ly+'%';
      b.innerHTML='<b>'+p.name+'</b><small>'+p.sub+'</small>';
    } else {
      b=document.createElement('button'); b.className='hot'+(p.x<16?' tip-l':p.x>84?' tip-r':''); b.style.left=p.x+'%'; b.style.top=p.y+'%';
      b.setAttribute('aria-label',p.name); b.innerHTML=(i+1)+'<span class="tip">'+p.name+'</span>';
    }
    b.setAttribute('aria-pressed','false'); b.onclick=()=>show(p.id); stage.appendChild(b); hotBtns[p.id]=b;
    const li=document.createElement('li'), c=document.createElement('button');
    c.innerHTML='<span>'+(i+1)+'</span>'+p.name; c.setAttribute('aria-pressed','false'); c.onclick=()=>show(p.id);
    li.appendChild(c); chips.appendChild(li); chipBtns[p.id]=c;
  });
  if(cur.labels){ if(photo.complete) drawLeaders(); else photo.onload=drawLeaders; }
  detail.innerHTML='<div class="empty"><h2>'+(cur.labels?'Pick an item':'Pick a component')+'</h2><p class="role">'+(cur.labels?'Tap a label on the photo or a name above to see its courses.':'Tap a marker on the photo or a name above.')+'</p></div>';
  overview.innerHTML=cur.overview;
  try{history.replaceState(null,'','#'+id)}catch(e){}
}
function show(id){
  const p=cur.parts.find(q=>q.id===id);
  for(const k in hotBtns){hotBtns[k].setAttribute('aria-pressed',k===id);chipBtns[k].setAttribute('aria-pressed',k===id);}
  detail.style.animation='none'; detail.offsetHeight; detail.style.animation='';
  if(p.courses){
    detail.innerHTML='<h2>'+p.name+'</h2><p class="official">'+p.official+'</p><p class="role">'+p.role+'</p>'+
      p.courses.map(c=>'<div class="course"><h3>'+c.c+' <i>'+c.items.length+(c.items.length>1?' labs':' lab')+'</i></h3><ul>'+c.items.map(it=>{const k=it[1].indexOf('. ');const ti=k>0?it[1].slice(0,k):it[1], ds=k>0?it[1].slice(k+2):'';return '<li><span>'+it[0]+'</span><b>'+ti+'</b>'+(ds?'<p class="ds">'+ds+'</p>':'')+'</li>';}).join('')+'</ul></div>').join('')+
      (p.specs?'<button class="speclink" id="speclink">See parts and specifications</button>':'');
    if(p.specs) document.getElementById('speclink').onclick=()=>{load(p.specs);window.scrollTo({top:0,behavior:'smooth'});};
  } else
  detail.innerHTML='<h2>'+p.name+'</h2><p class="role">'+p.role+'</p><table class="specs"><tbody>'+
    p.specs.map(s=>'<tr><th scope="row">'+s[0]+'</th><td>'+s[1]+'</td></tr>').join('')+'</tbody></table>'+(p.note?'<p class="note">'+p.note+'</p>':'');
  if(window.matchMedia('(max-width:860px)').matches) detail.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function drawLeaders(){
  const svg=stage.querySelector('.leaders'); if(!svg) return; const R=stage.getBoundingClientRect();
  svg.setAttribute('viewBox','0 0 '+R.width+' '+R.height); svg.innerHTML='';
  cur.parts.forEach(p=>{ const b=hotBtns[p.id].getBoundingClientRect();
    const tx=p.x/100*R.width, ty=p.y/100*R.height;
    const x1=b.left-R.left, y1=b.top-R.top, x2=x1+b.width, y2=y1+b.height;
    const cx=Math.min(Math.max(tx,x1),x2), cy=Math.min(Math.max(ty,y1),y2);
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',cx);l.setAttribute('y1',cy);l.setAttribute('x2',tx);l.setAttribute('y2',ty); svg.appendChild(l); });
}
window.addEventListener('resize',()=>{ if(cur&&cur.labels) drawLeaders(); });
const h0=location.hash.slice(1); load(['all','stepper','dc'].includes(h0)?h0:'all');
</script>
</body>
</html>
